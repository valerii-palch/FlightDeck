<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FlightDeck — Маршрутный лист</title>
<link rel="icon" id="appIcon" href="__LOGO__">
<style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#121f30;--border:#2b3d54;--muted:#a9bbd2;--blue:#4daaff;--green:#70dbab;--amber:#ffc25f}
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#eef4ff}
button,input,select,textarea{font:inherit;color:inherit;background:#1b2b40;border:1px solid #3a516d;border-radius:8px;padding:9px 12px}
button,select{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{cursor:default;opacity:.5}
button.primary,button.active{background:#1d5fb1;border-color:#367fda}input,select,textarea{min-width:0;max-width:100%}label{display:grid;gap:5px}
.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 14px;display:flex;flex-direction:column;gap:8px;background:#101b2a;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:17px;margin:0 8px 18px}.sidebar button{text-align:left}.grow{flex:1}.sidebar .tail{font-variant-numeric:tabular-nums}
main{padding:24px;max-width:1500px;width:100%;margin:0 auto}.top,.row,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls{justify-content:flex-start;flex-wrap:wrap}.top{margin-bottom:18px}
h1,h2,h3,p{margin:0}h1{font-size:28px}h2{font-size:20px}p+ p{margin-top:8px}.muted,small{color:var(--muted)}.clock,.code,.time{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:linear-gradient(135deg,#142235,#101b2a);border:1px solid var(--border);border-radius:13px;padding:17px;min-width:0}.panel + .panel{margin-top:14px}.grid>.panel{margin:0}.panel h2{margin-bottom:13px}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start;margin:14px 0 0}.arrow{color:var(--blue);font-size:26px;margin-top:8px}.code{font-size:clamp(21px,3vw,41px);font-weight:850;letter-spacing:-.04em}.code small{font-size:.55em;letter-spacing:0}.route label{margin:10px 0}.time{font-weight:700;font-size:19px}
.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#22354c;color:#dceaff}.good{color:var(--green)}.late{color:var(--amber)}.forecast{margin-top:12px;padding:12px;background:#172b3b;border-radius:8px}.forecast.late{background:#342a1e}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted)}td input{width:100%;min-width:70px;padding:5px}td button{padding:5px 8px}.strip{padding:10px 0;border-bottom:1px solid var(--border)}.strip:last-child{border:0}
.list{max-height:62vh;overflow:auto;display:grid;gap:6px;align-content:start}.list button{text-align:left}.list .row{justify-content:space-between}.stack{display:grid;gap:10px}.facts{margin-top:12px}.facts p{margin-top:7px}.big{font-size:34px;font-weight:800}.empty{padding:35px;text-align:center}.editor{display:grid;gap:12px}.editor .full{grid-column:1/-1}
dialog{width:min(680px,94vw);color:inherit;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}dialog::backdrop{background:#0009}dialog h2{margin-bottom:14px}#notice{position:fixed;bottom:16px;right:16px;max-width:80vw;z-index:2}#notice:empty{display:none}
@media(max-width:920px){.shell{grid-template-columns:166px minmax(0,1fr)}main{padding:16px}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.sidebar{height:auto;position:static;display:flex;flex-flow:row wrap}.sidebar .brand,.sidebar .grow{display:none}.route{gap:7px}.top{align-items:flex-start}}
__EXTRA_CSS__
</style></head>

 <div class="splash-card">

 </div>

<script>
'use strict';
const isWindowsDesktop=Boolean(window.flightDeckWindow);
if(isWindowsDesktop) document.documentElement.dataset.platform='windows';
__LOCALIZATION__
applyLanguage();
// Public aircraft registrations and commemorative names painted on the airframes.
// These are aircraft labels. Pilot profile and account data are stored separately.
// https://www.flightradar24.com/data/aircraft/RA-73709
// https://www.flightradar24.com/data/aircraft/RA-73155
// https://www.flightradar24.com/data/aircraft/RA-73132
const fleet = [
 {tail:'RA-73709', short:'A321', type:'Airbus A321-211', name:'Узкофюзеляжный', airframeName:{ru:'А. Шнитке',en:'A. Schnittke'}, seats:[167,0,16], stands:'narrow'},
 {tail:'RA-73155', short:'A350', type:'Airbus A350-900', name:'Широкофюзеляжный', airframeName:{ru:'А. Дементьев',en:'A. Dementyev'}, seats:[264,24,28], stands:'wide'},
 {tail:'RA-73132', short:'B777', type:'Boeing 777-300ER', name:'Широкофюзеляжный', airframeName:{ru:'М. Лермонтов',en:'M. Lermontov'}, seats:[324,48,30], stands:'wide'}
];
const aircraftModel = a => a.type;
const aircraftDisplayName = a => a.airframeName?.[appLanguage()] || '';
const aircraftFor = tail => fleet.find(a=>a.tail===tail);
const appCredit = '<small class="app-credit">by Valerii Vakhrushev</small><small class="version">v__VERSION__</small>';
const statuses = ['Запланирован','Подготовка','Загрузка багажа','Идет посадка','Посадка завершена','Вылетел','Выполнен','Уход на запасной','Отменен','Задержан'];
const stages = [['fuel','Начало заправки',50],['bags','Начало загрузки багажа',35],['board','Начало посадки',30],['close','Окончание посадки',10]];
const preparationOffset=(f,key,offset)=>key==='fuel'&&aircraftFor(f.tail)?.short!=='A321'?offset*2:offset;
const pages = [['home','Главная'],['center','Полетный центр'],['journal','Журнал'],['fleet','Флот'],['airports','Аэропорты'],['pilot','Профиль']];
const storageKey = 'flightdesk.v1';
const byId = id => document.getElementById(id);
const brandImage=byId('appIcon').href;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = {airports:[],flights:[]};
let journalOwner;
const deviceJournals = new Map();
const nativeStorage = window.webkit?.messageHandlers?.saveState;
let storageAvailable = true;
try {
 const saved = nativeStorage ? null : localStorage.getItem(storageKey);
 const stored = window.flightDeskState ?? (saved ? JSON.parse(saved) : null);
 if (Array.isArray(stored?.airports)&&Array.isArray(stored?.flights)) {
  const {journalOwner:owner,deviceJournals:archives,workspaceUnlocked,...journal}=stored;
  data=journal;
  journalOwner=owner||journal.cloudCheckpoint?.owner;
  for(const [id,archive] of Object.entries(archives??{})){
   if(Array.isArray(archive?.airports)&&Array.isArray(archive?.flights))deviceJournals.set(id,archive);
  }
 }
} catch { storageAvailable = false; }
let page = 'home', tail = fleet[0].tail, selected, explicitAircraft=false, airportCode = '';
let query = '', airportFilter = 'all', journalFilter = 'all', regionFilter = 'all', statusFilter = 'all', detailTail = '', noticeTimer;
function notice(message) {
 byId('notice').textContent = message;
 clearTimeout(noticeTimer);
 noticeTimer = setTimeout(() => byId('notice').textContent = '', 4200);
}
function save(sync=true) {
 if(sync) queueCloudSync();
 const stored=JSON.stringify({...data,journalOwner,deviceJournals:Object.fromEntries(deviceJournals)});
 if (nativeStorage) { nativeStorage.postMessage(stored); return; }
 try { localStorage.setItem(storageKey, stored); storageAvailable = true; }
 catch { storageAvailable = false; notice(tr("Хранилище недоступно. Выгрузи резервную копию.")); }
}
const aircraft = () => fleet.find(a => a.tail === tail);
const capacity = a => a.seats.reduce((sum,n) => sum+n,0);
const airport = code => data.airports.find(a => a.icao === code);
const flight = () => summaryFlights().find(f => f.id === selected && f.tail === tail);
const dateUTC = () => new Date().toISOString().slice(0,10);
const displayDate = date => /^(\d{4})-(\d{2})-(\d{2})$/.test(date||'') ? date.split('-').reverse().join('.') : '';
const dateField = (name,value,required=false) => '<span class="date-editor"><input name="'+name+'" type="text" data-flight-date inputmode="numeric" maxlength="10" placeholder="'+tr('ДД.ММ.ГГГГ')+'" value="'+displayDate(value)+'" '+(required?'required':'')+'>'+
 '<button type="button" class="icon-button" data-action="pick-date" aria-label="'+tr('Выбрать дату')+'">'+toolbarIcon('calendar')+'</button></span>';
function parseDisplayDate(value){
 if(!/^\d{2}\.\d{2}\.\d{4}$/.test(value))return '';
 const iso=value.split('.').reverse().join('-');
 const day=new Date(iso+'T00:00:00Z');
 return Number.isFinite(day.getTime())&&day.toISOString().slice(0,10)===iso?iso:'';
}
const timeField=(name,value,required=false,plain=false)=>'<input name="'+name+'" type="text" data-flight-time inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="HH:MM" value="'+esc(value)+'" '+(required?'required':'')+'>'+
 (['std','sta','atd','ata'].includes(name)&&!plain?'<small class="local-flight-time" data-local-time="'+name+'"></small>':'');
document.addEventListener('input',event=>{
 const field=event.target;
 if(!field.matches('[data-flight-time]')||event.isComposing)return;
 const raw=field.value, caret=field.selectionStart;
 const digits=raw.replace(/\D/g,'').slice(0,4);
 const separator=/^\d:/.test(raw)&&digits.length<=3?1:2;
 const formatted=digits.length>separator?digits.slice(0,separator)+':'+digits.slice(separator):digits;
 if(raw===formatted)return;
 const count=raw.slice(0,caret).replace(/\D/g,'').length;
 field.value=formatted;
 const position=Math.min(formatted.length,count+Number(count>separator));
 field.setSelectionRange(position,position);
},true);
function parseFlightTime(value){
 const match=/^([0-9]{1,2}):([0-9]{2})$/.exec(value.trim());
 return match&&Number(match[1])<24&&Number(match[2])<60?match[1].padStart(2,'0')+':'+match[2]:'';
}
function flightFormValues(form) {
 const values=Object.fromEntries(new FormData(form));
 for(const field of form.querySelectorAll('[data-flight-date],[data-flight-time]')){
  const value=field.value.trim();
  if(!value&&!field.required){values[field.name]='';continue;}
  const isDate=Object.hasOwn(field.dataset,'flightDate');
  const normalized=isDate?parseDisplayDate(value):parseFlightTime(value);
  if(!normalized){
   field.setCustomValidity(tr(isDate?'Введи дату в формате ДД.ММ.ГГГГ.':'Введи время в формате ЧЧ:ММ, от 00:00 до 23:59.'));
   field.addEventListener('input',()=>field.setCustomValidity(''),{once:true});
   field.reportValidity();
   return null;
  }
  values[field.name]=normalized;
 }
 return values;
}
const utcLabel=(now=new Date())=>{
 const [date,time]=now.toISOString().split('T');
 return displayDate(date)+' · '+time.slice(0,8)+' UTC';
};
const toolbarIcon=kind=>{
 const icons={
  add:'<path d="M12 5v14M5 12h14"/>',
  calendar:'<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 3v5m8-5v5M4 10h16"/>',
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  fullscreen:'<path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-.5 2.4-2 .9L5.2 5l-2.1 2.1 1.3 2.3-.9 2L1 12l2.5.6.9 2-1.3 2.3L5.2 19l2.3-1.3 2 .9L10 21h4l.5-2.4 2-.9 2.3 1.3 2.1-2.1-1.3-2.3.9-2L23 12l-2.5-.6-.9-2 1.3-2.3L18.8 5l-2.3 1.3-2-.9L14 3z"/>'
 };
 return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[kind]+'</svg>';
};

const option = (value, label, current) => '<option value="'+esc(value)+'"'+(value === current?' selected':'')+'>'+esc(label)+'</option>';
const codeLabel = code => '<span class="code">'+esc(code)+(airportIata(code)?' <small>/ '+esc(airportIata(code))+'</small>':'')+'</span>';
const duration = minutes => Number.isFinite(minutes) ? Math.floor(minutes/60)+` ${tr("ч")} `+minutes%60+` ${tr("мин")}` : '—';
const clockOn = (date,time) => Date.parse(date+'T'+time+':00Z');
const minute = 60000;
const formatTime = (time,date) => {
 const value = new Date(time).toISOString();
 const delta = Math.round((Date.parse(value.slice(0,10))-Date.parse(date))/86400000);
 return '<span class="clock-stamp">'+value.slice(11,16)+(delta?'<small class="day-offset">'+(delta>0?'+':'')+delta+'</small>':'')+'</span>';
};
function forecast(f) {
 if (!f.std || ['Вылетел','Выполнен','Отменен','Уход на запасной'].includes(f.status)) return '';
 const plan = clockOn(f.date,f.std);
 if (!Number.isFinite(plan)) return '';
 const latestBoard=Number.isFinite(Date.parse(f.stages?.close))?'close':'board';
 const estimates=stages.filter(([key])=>key==='fuel'||key==='bags'||key===latestBoard)
  .map(([key,,offset])=>Date.parse(f.stages?.[key])+preparationOffset(f,key,offset)*minute).filter(Number.isFinite);
 const estimate=Math.max(plan,...estimates);
 const delay = Math.round((estimate-plan)/minute);
 return '<div class="forecast row '+(delay?'late':'good')+`"><span>${tr("Прогноз вылета")}</span><strong class="time">`+formatTime(estimate,f.date)+' UTC'+(delay?' · +'+delay+` ${tr("мин")}`:'')+'</strong></div>';
}
function stands(code) {
 const raw = airport(code)?.stands?.[aircraft().stands] || '';
 let group = '', items = [];
 for (const rawLine of raw.split('\n')) {
  const line = rawLine.trim();
  if (/^\*?anyway\*?$/i.test(line)) { items.push('Любая стоянка'); continue; }
  if (!line || /^-+$/.test(line) || /^\*?inop\*?$/i.test(line) || line.startsWith('*')) continue;
  if (line.endsWith(':')) { group = line.slice(0,-1); continue; }
  for (const item of line.split(',').map(s=>s.trim()).filter(Boolean)) {
   const match = item.match(/^([A-Z]*)(\d+)([A-Z]*)\s*[-–]\s*([A-Z]*)(\d+)([A-Z]*)$/i);
   const prefix = group ? group+' · ' : '';
   if (match && (!match[4] || match[1] === match[4]) && match[3] === match[6] &&
        Number(match[5]) >= Number(match[2]) && Number(match[5])-Number(match[2]) <= 100) {
    for (let i=Number(match[2]);i<=Number(match[5]);i++) items.push(prefix+match[1]+String(i).padStart(match[2].length,'0')+match[3]);
   } else items.push(prefix+item);
  }
 }
 return [...new Set(items)];
}
function standSelect(f,key,code,title) {
 const choices = stands(code), current = f[key] || '';
 const unrestricted = choices.includes('Любая стоянка');
 if (current && !choices.includes(current)) choices.unshift(current);
 const raw = airport(code)?.stands?.[aircraft().stands] || '';
 return '<label class="stand-label">'+title+'<span class="flight-select stand-select"><select data-stand="'+key+'" '+(!choices.length?'disabled':'')+'>'+
 option('',choices.length?tr("Выбрать стоянку"):/inop/i.test(raw)?'INOP':tr("Нет данных"),current)+choices.map(v=>option(v,v==='Любая стоянка'?tr(v):v,current)).join('')+
 (unrestricted?option('__manual',tr("Указать номер вручную…"),current):'')+'</select></span></label>';
}
function manualStand(f,key) {
 openDialog(`<h2>${tr("Номер стоянки")}</h2><form id="standForm" class="stack"><label>${tr("Стоянка")}<input name="stand" required maxlength="40" placeholder="${tr("Например, 118A")}"></label><div class="controls"><button class="primary">${tr("Сохранить")}</button><button type="button" data-action="close">${tr("Отмена")}</button></div></form>`);
 byId('standForm').onsubmit = event => {
  event.preventDefault();
  const value = event.target.elements.stand.value.trim();
  if (!value || value === '__manual') return;
  f[key] = value;
  save();
  byId('dialog').close();
  render();
 };
}
function paxText(f) {
 const max = capacity(aircraft());
 return f.pax == null ? '—' : f.pax+' / '+max+' · '+Math.round(f.pax/max*100)+'%';
}
function routeSide(f,key,title) {
 const code=f[key], arriving=key==='arr';
 const times=flightTimes(f);
 const planned=arriving?times.scheduledArrival:times.scheduledDeparture;
 const actual=arriving?destinationArrival(f,times):preflightStatuses.includes(f.status)?NaN:times.actualDeparture;
 const destination=airport(code);
 const flags=destination?[[tr("Сценарий"),destination.scenery],['GSX',destination.gsx],['Python',destination.python]]
  .map(([label,enabled])=>'<span class="badge '+(enabled?'good':'muted')+'">'+label+' '+(enabled?'✓':'—')+'</span>').join(''):'';
 return '<div class="route-detail">'+
  '<div class="controls facts">'+flags+'</div>'+standSelect(f,key+'Stand',code,title)+'</div>';
}
function segmentProgress(leg,now) {
 if(leg.status==='Отменен'||preflightStatuses.includes(leg.status)||leg.status!=='Вылетел'&&!leg.atd) return 0;
 const times=flightTimes(leg);
 const start=times.actualDeparture||times.scheduledDeparture;
 const duration=times.scheduledArrival-times.scheduledDeparture;
 if(!Number.isFinite(start)||!(duration>0)) return 0;
 return Math.max(0,Math.min(95,Math.round((now-start)/duration*100)));
}
function routeProgress(f,now=Date.now()) {
 if(f.status==='Отменен')return 0;
 if(flown(f))return 100;
 if(!isDiversion(f)||!alternate(f))return segmentProgress(f,now);
 if(!alternateLanded(f))return segmentProgress(f,now)/2;
 const next=continuationLeg(f);
 return 50+(next?segmentProgress(next,now)/2:0);
}
function routeEndpoint(code) {
 const info=airportInfo(code);
 return '<div class="flight-endpoint">'+codeLabel(code)+'<p class="muted">'+esc(airportCity(code))+'</p></div>';
}
function routeProgressLabel(f,progress) {
 if(f.status==='Отменен') return tr("Рейс отменен");
 if(progress===100) return tr("Прибыл");
 if(isDiversion(f)&&alternate(f)){
  if(progress<50)return tr('Уход на запасной');
  if(progress===50)return tr('Посадка на запасном');
 }
 if(progress===0) return tr("До вылета");
 return tr("В пути · расчетный прогресс");
}
function routeOverview(f) {
 const progress=routeProgress(f);
 const stop=isDiversion(f)&&alternate(f);
 const stopName=stop?esc(airportCity(stop)||stop):'';
 return '<div class="flight-route">'+routeEndpoint(f.dep)+
 '<div class="flight-path"><div class="flight-track" id="flightTrack" style="--progress:'+progress+'%"><div class="flight-track-fill"></div>'+
 (stop?'<span class="flight-stop"><span>'+stopName+' · '+esc(stop)+'</span></span>':'')+
 '<span class="flight-marker">'+planeIcon+'</span></div><small id="flightProgressLabel">'+routeProgressLabel(f,progress)+'</small></div>'+
 routeEndpoint(f.arr)+'</div>';
}
function center() {
 if(!explicitAircraft){
  const current=workingFlight(summaryFlights());
  if(current){tail=current.tail;selected=current.id;}
  else return '<div class="panel empty"><h2>'+tr('Нет актуального рейса')+'</h2><p class="muted">'+tr('Выбери борт в боковом меню или добавь рейс.')+'</p></div>';
 }
 const f = flight();
 const list = newest(summaryFlights().filter(f=>f.tail===tail));
 if (!f) return '<div class="panel empty"><h2>'+esc(aircraft().type)+`</h2><p class="muted">${tr("Для этого борта пока нет рейсов.")}</p></div>`;
 const times = f.stages || {};
 const nextStage=pendingStage(f);
 const stageRows = stages.map(([key,label,offset]) => {
  const planned = clockOn(f.date,f.std)-preparationOffset(f,key,offset)*minute, actual = Date.parse(times[key]);
  const late = Number.isFinite(actual) && actual > planned;
  return '<tr'+(nextStage?.[0]===key?' class="stage-next-row"':'')+'><td>'+tr(label)+'</td><td class="clock">'+(Number.isFinite(planned)?formatTime(planned,f.date):'—')+'</td><td class="clock '+(late?'late':'')+'">'+
  (Number.isFinite(actual)?formatTime(actual,f.date):'—')+'</td><td><button data-stage="'+key+'">'+(times[key]?tr("Изменить"):tr("Отметить"))+'</button></td></tr>';
 }).join('');
 return '<div class="panel flight-hero"><div class="row flight-hero-header"><div class="controls"><strong>'+flightNumber(f)+'</strong>'+'<span class="muted">'+displayDate(f.date)+'</span><span class="badge">'+esc(f.tail)+'</span></div>'+

async function fetchAirportPhoto(code){

function validBackup(value) {
 return value && Array.isArray(value.airports) && Array.isArray(value.flights) &&
 value.airports.every(a=>a && /^[A-Z]{4}$/.test(a.icao) && typeof a.name==='string') &&
 value.flights.every(f=>f && typeof f.id==='string' && fleet.some(a=>a.tail===f.tail) &&
 /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(f.date) && /^[0-9]{2}:[0-9]{2}$/.test(f.std) &&
 Number.isFinite(clockOn(f.date,f.std)) && typeof f.sta==='string');
}
function exportBackup() {

 const content=JSON.stringify(exported,null,2);

  window.webkit.messageHandlers.exportBackup.postMessage(content); return;
 }
 const link=document.createElement('a'), url=URL.createObjectURL(new Blob([content],{type:'application/json'}));
 link.href=url; link.download='flightdesk-backup.json'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}

 `<label>${tr("Загрузить копию")}<input id="backupFile" type="file" accept=".json,application/json"></label><button id="importBackup" disabled>${tr("Заменить данные из копии")}</button></div>`);
 byId('exportBackup').onclick=exportBackup;

 byId('importBackup').onclick=async()=>{
  try {

 };
}

 if(d.action==='delete-flight') confirmFlightDeletion(flight());
 if(d.action==='divert') editFlight(flight(),true);
 if(d.action==='continuation') editContinuation(flight());
 if(d.action==='close'){
  if(byId('dialog').dataset.layout==='settings')closeSettings();
  else byId('dialog').close();
 }
 if(d.action==='backup') backup();
 if(d.action==='export-backup'&&cloudSession) exportBackup();
});
document.addEventListener('keydown',e=>{
 const pin=e.target.closest('[data-catalog-pin]');
 if(pin&&['Enter',' '].includes(e.key)){e.preventDefault();openAirportCard(pin.dataset.catalogPin);return;}
 if (!e.target.closest('.fleet-carousel') || !['ArrowLeft','ArrowRight'].includes(e.key)) return;
 const direction = e.key==='ArrowLeft'?'previous':'next';
 e.preventDefault();
 document.querySelector('[data-slide-focus="'+direction+'"]')?.click();
});
document.addEventListener('input',e=>{
 if(e.target.id==='journalSearch'){journalQuery=e.target.value;byId('boardRows').innerHTML=boardRows();}
 if(e.target.id==='airportSearch'){query=e.target.value;refreshAirports();}
});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(t.id==='mapAirport'){selectMapAirport(t.value);}
 if(t.id==='status'){
  const f=flight(), status=t.value;
  t.value=f.status;
  if(status==='Уход на запасной'||isDiversion(f)) editFlight(f,status==='Уход на запасной');
  else changeFlightStatus(f,status);
 }
 if(t.id==='flightPicker'){selected=t.value;render();}
 if(t.id==='airportFilter'){airportFilter=t.value;refreshAirports();}
 if(t.id==='regionFilter'){regionFilter=t.value;refreshAirports();}
 if(t.id==='airportCountry'){
  airportCountryFilter=t.value;airportListPage=0;query='';regionFilter='all';
  render();byId('airportCountry')?.focus();
 }
 if(t.id==='typeFilter'){typeFilter=t.value;render();}
 if(t.id==='statusFilter'){statusFilter=t.value;render();}
 if(t.id==='journalFilter'){journalFilter=t.value;render();}
 if(d.stand){
  const f=flight();
  if(t.value==='__manual'){t.value=f[d.stand]||'';manualStand(f,d.stand);}
  else {f[d.stand]=t.value;save();}
 }
 if(t.id==='profilePhotoInput'){const file=t.files[0];t.value='';setProfilePhoto(file);}
});
function updateDaylight(now=new Date()){
 const hour=now.getHours();
 const daylight=hour<5||hour>=21?'night':hour<11?'morning':hour<17?'day':'evening';
 if(document.body.dataset.daylight!==daylight)document.body.dataset.daylight=daylight;
}
updateDaylight();
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden)updateDaylight();
});
if(!flight()) pickTail(tail);
render();
resumeGoogleSignIn().then(restoreCloudSession);
window.addEventListener('focus',()=>{updateDaylight();queueCloudSync(0);});
const splash = byId('splash');
const shell = document.querySelector('.shell');
shell.inert = true;
splash.classList.add('loading');
setTimeout(() => {
 splash.classList.add('ready');
 splash.setAttribute('aria-hidden','true');
 shell.inert = false;
 if(cloudSession&&!tourCompleted()&&!byId('dialog').open)startTour();
 startApplicationUpdates();
}, 2000);
if(!storageAvailable) notice(tr("Хранилище недоступно. Выгрузи резервную копию после работы."));
setInterval(()=>queueCloudSync(0),45000);
window.addEventListener('online',()=>queueCloudSync(0));
window.addEventListener('offline',updateCloudIndicator);
setInterval(()=>{
 const now=new Date();
 updateDaylight(now);
 const clock=byId('utcClock');
 if(clock) clock.textContent=utcLabel(now);
 const track=byId('flightTrack');
 if(track&&flight()){
  const progress=routeProgress(flight());
  track.style.setProperty('--progress',progress+'%');
  byId('flightProgressLabel').textContent=routeProgressLabel(flight(),progress);
 }
 const dashTrack=byId('dashboardFlightProgress');
 const current=dashTrack&&data.flights.find(row=>row.id===dashTrack.dataset.flightId);
 if(current){
  const progress=Math.round(routeProgress(current));
  dashTrack.style.setProperty('--progress',progress+'%');
  dashTrack.setAttribute('aria-valuenow',progress);
  dashTrack.setAttribute('aria-valuetext',routeProgressLabel(current,progress));
 }
},1000);
</script></body></html>
