<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlightDeck — Маршрутный лист</title>
<link rel="icon" href="__LOGO__">
<style>
:root{color-scheme:dark;--bg:#0b1421;--panel:#121f30;--border:#2b3d54;--muted:#a9bbd2;--blue:#4daaff;--green:#70dbab;--amber:#ffc25f}
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#eef4ff}
button,input,select,textarea{font:inherit;color:inherit;background:#1b2b40;border:1px solid #3a516d;border-radius:8px;padding:9px 12px}
button,select{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{cursor:default;opacity:.5}
button.primary,button.active{background:#1d5fb1;border-color:#367fda}input,select,textarea{min-width:0;max-width:100%}label{display:grid;gap:5px}
.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{padding:22px 14px;display:flex;flex-direction:column;gap:8px;background:#101b2a;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:17px;margin:0 8px 18px}.sidebar button{text-align:left}.grow{flex:1}.sidebar .tail{font-variant-numeric:tabular-nums}
main{padding:24px;max-width:1500px;width:100%;margin:0 auto}.top,.row,.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.controls{justify-content:flex-start;flex-wrap:wrap}.top{margin-bottom:18px}
h1,h2,h3,p{margin:0}h1{font-size:28px}h2{font-size:20px}p+ p{margin-top:8px}.muted,small{color:var(--muted)}.clock,.code,.time{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:linear-gradient(135deg,#142235,#101b2a);border:1px solid var(--border);border-radius:13px;padding:17px;min-width:0}.panel + .panel{margin-top:14px}.grid>.panel{margin:0}.panel h2{margin-bottom:13px}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:start;margin:14px 0 0}.arrow{color:var(--blue);font-size:26px;margin-top:8px}.code{font-size:clamp(21px,3vw,41px);font-weight:850;letter-spacing:-.04em}.code small{font-size:.55em;letter-spacing:0}.route label{margin:10px 0}.time{font-weight:700;font-size:19px}
.badge{display:inline-block;padding:5px 8px;border-radius:7px;background:#22354c;color:#dceaff}.good{color:var(--green)}.late{color:var(--amber)}.forecast{margin-top:12px;padding:12px;background:#172b3b;border-radius:8px}.forecast.late{background:#342a1e}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border)}th{font-size:12px;color:var(--muted)}td input{width:100%;min-width:70px;padding:5px}td button{padding:5px 8px}.strip{padding:10px 0;border-bottom:1px solid var(--border)}.strip:last-child{border:0}
.list{max-height:62vh;overflow:auto;display:grid;gap:6px;align-content:start}.list button{text-align:left}.list .row{justify-content:space-between}.stack{display:grid;gap:10px}.facts{margin-top:12px}.facts p{margin-top:7px}.big{font-size:34px;font-weight:800}.empty{padding:35px;text-align:center}.editor{display:grid;gap:12px}.editor .full{grid-column:1/-1}
dialog{width:min(680px,94vw);color:inherit;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}dialog::backdrop{background:#0009}dialog h2{margin-bottom:14px}#notice{position:fixed;bottom:16px;right:16px;max-width:80vw;z-index:2}#notice:empty{display:none}
@media(max-width:920px){.shell{grid-template-columns:166px minmax(0,1fr)}main{padding:16px}.three{grid-template-columns:1fr}.two{grid-template-columns:1fr}}@media(max-width:620px){.shell{display:block}.sidebar{height:auto;position:static;display:flex;flex-flow:row wrap}.sidebar .brand,.sidebar .grow{display:none}.route{gap:7px}.top{align-items:flex-start}}

 <div class="splash-card">

 </div>

 <div id="windowControls" class="window-controls"></div>
 <aside class="sidebar" id="nav"></aside>
 <div class="workspace">
  <main id="main"></main>
  
 </div>
</div>
<dialog id="dialog"></dialog><div id="notice" class="badge" role="status"></div>

<script>
'use strict';
__LOCALIZATION__
applyLanguage();
const fleet = [
 {tail:'RA-73709', short:'A321', type:'Airbus A321-211', name:'А. Шнитке', seats:[167,0,16], stands:'narrow'},
 {tail:'RA-73155', short:'A350', type:'Airbus A350-900', name:'А. Дементьев', seats:[264,24,28], stands:'wide'},
 {tail:'RA-73132', short:'B777', type:'Boeing 777-300ER', name:'М. Лермонтов', seats:[324,48,30], stands:'wide'}
];
const aircraftModel = a => a.type;
const aircraftFor = tail => fleet.find(a=>a.tail===tail);
const appCredit = '<small class="version">v__VERSION__</small>';
const statuses = ['Запланирован','Подготовка','Идет посадка','Посадка завершена','Вылетел','Выполнен','Уход на запасной','Отменен','Задержан'];
const stages = [['fuel','Начало заправки',50],['bags','Начало загрузки багажа',35],['board','Начало посадки',30],['close','Окончание посадки',10]];
const pages = [['home','Главная'],['center','Полетный центр'],['fleet','Флот'],['airports','Аэропорты'],['journal','Журнал'],['pilot','Профиль']];
const storageKey = 'flightdesk.v1';
const byId = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = {airports:[],flights:[]};
const nativeStorage = window.webkit?.messageHandlers?.saveState;
let storageAvailable = true;
try {
 const saved = nativeStorage ? null : localStorage.getItem(storageKey);
 const stored = window.flightDeskState ?? (saved ? JSON.parse(saved) : null);
 if (Array.isArray(stored?.airports)&&Array.isArray(stored?.flights)) data = stored;
} catch { storageAvailable = false; }
let page = 'home', tail = fleet[0].tail, selected, airportCode = '';
let query = '', airportFilter = 'all', journalFilter = 'all', regionFilter = 'all', statusFilter = 'all', detailTail = '', noticeTimer;
function notice(message) {
 byId('notice').textContent = message;
 clearTimeout(noticeTimer);
 noticeTimer = setTimeout(() => byId('notice').textContent = '', 4200);
}
function save(sync=true) {
 if(sync) queueCloudSync();
 if (nativeStorage) { nativeStorage.postMessage(JSON.stringify(data)); return; }
 try { localStorage.setItem(storageKey, JSON.stringify(data)); storageAvailable = true; }
 catch { storageAvailable = false; notice(tr("Хранилище недоступно. Выгрузи резервную копию.")); }
}
const aircraft = () => fleet.find(a => a.tail === tail);
const capacity = a => a.seats.reduce((sum,n) => sum+n,0);
const airport = code => data.airports.find(a => a.icao === code);
const flight = () => data.flights.find(f => f.id === selected && f.tail === tail);
const dateUTC = () => new Date().toISOString().slice(0,10);
const utcLabel=(now=new Date())=>{
 const [date,time]=now.toISOString().split('T');
 return date.split('-').reverse().join('.')+' · '+time.slice(0,8)+' UTC';
};
const toolbarIcon=kind=>{
 const icons={
  close:'<path d="m6 6 12 12M18 6 6 18"/>',
  fullscreen:'<path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="m10 3-.5 2.4-2 .9L5.2 5l-2.1 2.1 1.3 2.3-.9 2L1 12l2.5.6.9 2-1.3 2.3L5.2 19l2.3-1.3 2 .9L10 21h4l.5-2.4 2-.9 2.3 1.3 2.1-2.1-1.3-2.3.9-2L23 12l-2.5-.6-.9-2 1.3-2.3L18.8 5l-2.3 1.3-2-.9L14 3z"/>'
 };
 return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+icons[kind]+'</svg>';
};

const option = (value, label, current) => '<option value="'+esc(value)+'"'+(value === current?' selected':'')+'>'+esc(label)+'</option>';
const codeLabel = code => '<span class="code">'+esc(code)+(airport(code)?.iata?' <small>/ '+esc(airport(code).iata)+'</small>':'')+'</span>';
const duration = minutes => Number.isFinite(minutes) ? Math.floor(minutes/60)+` ${tr("ч")} `+minutes%60+` ${tr("мин")}` : '—';
const clockOn = (date,time) => Date.parse(date+'T'+time+':00Z');
const minute = 60000;
const formatTime = (time,date) => {
 const value = new Date(time).toISOString();
 const delta = Math.round((Date.parse(value.slice(0,10))-Date.parse(date))/86400000);
 return value.slice(11,16)+(delta?' '+(delta>0?'+':'')+delta:'');
};
function forecast(f) {
 if (!f.std || ['Вылетел','Выполнен','Отменен','Уход на запасной'].includes(f.status)) return '';
 const plan = clockOn(f.date,f.std);
 if (!Number.isFinite(plan) || !f.stages) return '';
 const started = Date.parse(f.stages.board), ended = Date.parse(f.stages.close);
 if (!Number.isFinite(started) && !Number.isFinite(ended)) return '';
 const estimate = Math.max(plan,Number.isFinite(ended)?ended+10*minute:started+30*minute);
 const delay = Math.round((estimate-plan)/minute);
 return '<div class="forecast row '+(delay?'late':'good')+`"><span>${tr("Прогноз вылета")}</span><strong class="time">`+formatTime(estimate,f.date)+' UTC'+(delay?' · +'+delay+` ${tr("мин")}`:'')+'</strong></div>';
}
function stands(code) {
 const raw = airport(code)?.stands?.[aircraft().stands] || '';
 let group = '', items = [];
 for (const rawLine of raw.split('\n')) {
  const line = rawLine.trim();
  if (/^\*?anyway\*?$/i.test(line)) { items.push('Любая стоянка'); continue; }
  if (!line || /^-+$/.test(line) || /^\*?inop\*?$/i.test(line) || line.startsWith('*')) continue;
  if (line.endsWith(':')) { group = line.slice(0,-1); continue; }
  for (const item of line.split(',').map(s=>s.trim()).filter(Boolean)) {
   const match = item.match(/^([A-Z]*)(\d+)([A-Z]*)\s*[-–]\s*([A-Z]*)(\d+)([A-Z]*)$/i);
   const prefix = group ? group+' · ' : '';
   if (match && (!match[4] || match[1] === match[4]) && match[3] === match[6] &&
        Number(match[5]) >= Number(match[2]) && Number(match[5])-Number(match[2]) <= 100) {
    for (let i=Number(match[2]);i<=Number(match[5]);i++) items.push(prefix+match[1]+String(i).padStart(match[2].length,'0')+match[3]);
   } else items.push(prefix+item);
  }
 }
 return [...new Set(items)];
}
function standSelect(f,key,code,title) {
 const choices = stands(code), current = f[key] || '';
 const unrestricted = choices.includes('Любая стоянка');
 if (current && !choices.includes(current)) choices.unshift(current);
 const raw = airport(code)?.stands?.[aircraft().stands] || '';
 return '<label class="stand-label">'+title+'<span class="flight-select stand-select"><select data-stand="'+key+'" '+(!choices.length?'disabled':'')+'>'+
 option('',choices.length?tr("Выбрать стоянку"):/inop/i.test(raw)?'INOP':tr("Нет данных"),current)+choices.map(v=>option(v,v==='Любая стоянка'?tr(v):v,current)).join('')+
 (unrestricted?option('__manual',tr("Указать номер вручную…"),current):'')+'</select></span></label>';
}
function manualStand(f,key) {
 openDialog(`<h2>${tr("Номер стоянки")}</h2><form id="standForm" class="stack"><label>${tr("Стоянка")}<input name="stand" required maxlength="40" placeholder="${tr("Например, 118A")}"></label><div class="controls"><button class="primary">${tr("Сохранить")}</button><button type="button" data-action="close">${tr("Отмена")}</button></div></form>`);
 byId('standForm').onsubmit = event => {
  event.preventDefault();
  const value = event.target.elements.stand.value.trim();
  if (!value || value === '__manual') return;
  f[key] = value;
  save();
  byId('dialog').close();
  render();
 };
}
function paxText(f) {
 const max = capacity(aircraft());
 return f.pax == null ? '—' : f.pax+' / '+max+' · '+Math.round(f.pax/max*100)+'%';
}
function routeSide(f,key,title,actual) {
 const code = f[key], arriving = key === 'arr';
 const times = flightTimes(f);
 const plannedStamp = arriving ? times.scheduledArrival : times.scheduledDeparture;
 const actualStamp = arriving ? times.actualArrival : times.actualDeparture;
 const destination = airport(code);
 const flags = destination ? [[tr("Сценарий"),destination.scenery],['GSX',destination.gsx],['Python',destination.python]]
  .map(([label,enabled])=>'<span class="badge '+(enabled?'good':'muted')+'">'+tr(label)+' '+(enabled?'✓':'—')+'</span>').join('') : '';
 return '<div class="route-detail"><p class="muted">'+(appLanguage()==='en' ? tr(arriving?'Запланированный прилет':'Запланированный вылет') : (arriving?'Прилет':'Вылет')+' по плану')+'</p><strong class="time">'+stampLabel(plannedStamp,f.date)+'</strong>'+
 (actual?`<p class="facts">${tr("Факт")} <strong class="time">`+stampLabel(actualStamp,f.date)+'</strong> '+(arriving?delayBadge(f):'')+'</p>':'')+'<div class="controls facts">'+flags+'</div>'+standSelect(f,key+'Stand',code,title)+'</div>';
}
function routeProgress(f,now=Date.now()) {
 if(f.status==='Отменен') return 0;
 if(isDiversion(f)&&!continuationLeg(f)) return 0;
 if(journalStatus(f)==='Выполнен') return 100;
 const leg=continuationLeg(f)||f;
 if(leg.status!=='Вылетел'&&!leg.atd) return 0;
 const times=flightTimes(leg);
 const start=times.actualDeparture||times.scheduledDeparture;
 const duration=times.scheduledArrival-times.scheduledDeparture;
 if(!Number.isFinite(start)||!(duration>0)) return 0;
 return Math.max(0,Math.min(95,Math.round((now-start)/duration*100)));
}
function routeEndpoint(code) {
 const info=airportInfo(code);
 return '<div class="flight-endpoint">'+codeLabel(code)+'<p class="muted">'+esc(airportCity(code))+'</p></div>';
}
function routeProgressLabel(f,progress) {
 if(f.status==='Отменен') return tr("Рейс отменен");
 if(progress===100) return tr("Прибыл");
 if(isDiversion(f)&&!continuationLeg(f)) return 'Уход на запасной';
 if(progress===0) return tr("До вылета");
 return tr("В пути · расчетный прогресс");
}
function routeOverview(f) {
 const progress=routeProgress(f);
 return '<div class="flight-route">'+routeEndpoint(f.dep)+
 '<div class="flight-path"><div class="flight-track" id="flightTrack" style="--progress:'+progress+'%"><div class="flight-track-fill"></div><span class="flight-marker">'+planeIcon+'</span></div><small id="flightProgressLabel">'+tr(routeProgressLabel(f,progress))+'</small></div>'+
 routeEndpoint(f.arr)+'</div>';
}
function center() {
 const f = flight();
 const list = newest(data.flights.filter(f=>f.tail===tail));
 if (!f) return '<div class="panel empty"><h2>'+esc(aircraft().type)+`</h2><p class="muted">${tr("Для этого борта пока нет рейсов.")}</p><p><button class="primary" data-action="new">${tr("Добавить рейс")}</button></p></div>`;
 const times = f.stages || {};
 const stageRows = stages.map(([key,label,offset]) => {
  const planned = clockOn(f.date,f.std)-offset*minute, actual = Date.parse(times[key]);
  const late = Number.isFinite(actual) && actual > planned;
  return '<tr><td>'+tr(label)+'</td><td class="clock">'+(Number.isFinite(planned)?formatTime(planned,f.date):'—')+'</td><td class="clock '+(late?'late':'')+'">'+
  (Number.isFinite(actual)?formatTime(actual,f.date):'—')+'</td><td><button data-stage="'+key+'">'+(times[key]?tr("Изменить"):tr("Отметить"))+'</button></td></tr>';
 }).join('');
 return '<div class="panel flight-hero"><div class="row flight-hero-header"><div class="controls"><strong>'+esc(f.number || tr("Без номера"))+'</strong>'+demoBadge(f)+'<span class="muted">'+esc(f.date)+'</span><span class="badge">'+esc(f.tail)+'</span></div>'+
 '<div class="controls">'+(!isDiversion(f)?`<button data-action="divert">${tr("Уход на запасной")}</button>`:'')+`<button class="primary" data-action="edit">${tr("Редактировать рейс")}</button></div></div>`+routeOverview(f)+'<div class="flight-details">'+routeSide(f,'dep',tr("Стоянка вылета"),f.atd)+routeSide(f,'arr',tr("Стоянка прилета"),isDiversion(f)?'':f.ata)+'</div>'+
 (f.note?'<p class="facts muted">'+esc(f.note)+'</p>':'')+
 `<div class="flight-status-bar facts"><label>${tr("Статус рейса")}<span class="flight-select status-select `+(statusColors[f.status]||'scheduled')+'"><select id="status">'+statuses.map(s=>option(s,tr(s),f.status)).join('')+'</select></span></label></div></div>'+continuationPanel(f)+
 `<div class="grid two facts"><section class="panel"><h2>${tr("Подготовка рейса")}</h2>`+
 (aircraft().short==='A321'?`<table><thead><tr><th>${tr("Этап")}</th><th>${tr("План UTC")}</th><th>${tr("Факт UTC")}</th><th></th></tr></thead><tbody>`+stageRows+'</tbody></table>'+forecast(f):`<p class="facts muted">${tr("Для этого типа сроки подготовки пока не заданы.")}</p>`)+
 `</section><section class="panel"><h2>${tr("Рейс")}</h2><div class="strip row"><span>${tr("Тип рейса")}</span><strong>`+tr(flightType(f))+'</strong></div>'+(f.goArounds?`<div class="strip row"><span>${tr("Уходы на второй круг")}</span><strong>`+esc(f.goArounds)+'</strong></div>':'')+`<div class="strip row"><span>${tr("Пассажиры")}</span><strong>`+paxText(f)+`</strong></div><div class="strip row"><span>${tr("Время полета по журналу")}</span><strong>`+duration(flightStats([f]).minutes || f.actualMinutes)+'</strong></div>'+
 (Number.isFinite(f.scheduledBlockMinutes)?`<div class="strip row"><span>${tr("Блок-время по плану")}</span><strong>`+duration(f.scheduledBlockMinutes)+'</strong></div>':'')+
 (f.sourceStatus?`<p class="muted">${tr("Статус в маршрутном листе:")} `+esc(f.sourceStatus)+'</p>':'')+
 `<label class="facts">${tr("Другой рейс борта")}<select id="flightPicker">`+list.map(x=>option(x.id,x.date+' · '+(x.number||tr("Без номера"))+' · '+x.dep+' → '+x.arr,f.id)).join('')+'</select></label>'+
 `<div class="flight-danger facts"><button class="danger" data-action="delete-flight">${tr("Удалить рейс")}</button></div></section></div>`;
}

function confirmFlightDeletion(f) {
 if(!f) return;
 openDialog(`<h2>${tr("Удалить рейс?")}</h2><p>`+flightNumber(f)+' · '+esc(f.dep)+' → '+esc(f.arr)+' · '+esc(f.date)+'</p>'+
  (f.continuation?`<p class="muted facts">${tr("Продолжение после посадки на запасном также будет удалено.")}</p>`:'')+
  `<div class="controls facts"><button data-action="close" autofocus>${tr("Отмена")}</button><button class="danger" id="confirmFlightDeletion">${tr("Удалить рейс")}</button></div>`);
 byId('confirmFlightDeletion').onclick=()=>{
  const index=data.flights.findIndex(row=>row.id===f.id);
  if(index<0) {byId('dialog').close();return;}
  const journal=data;
  const [removed]=journal.flights.splice(index,1);
  pickTail(removed.tail);
  save();byId('dialog').close();render();
  notice(tr("Рейс удален."));
  const undo=document.createElement('button');
  undo.type='button';undo.textContent=tr("Отменить");
  undo.onclick=()=>{
   if(data!==journal||data.flights.some(row=>row.id===removed.id)){
    notice(tr("Журнал изменился. Отмена удаления недоступна."));return;
   }
   data.flights.splice(index,0,removed);
   tail=removed.tail;selected=removed.id;page='center';
   save();render();notice(tr("Рейс восстановлен."));
  };
  byId('notice').append(' ',undo);
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>byId('notice').textContent='',12000);
 };
}

const isDomestic = a => airportCountry(a)==='RU';
const airportPageSize=9;
let airportListPage=0, airportCountryFilter='RU';
const catalogCountry=a=>airportCountry(a)||a.country||'';
const catalogCountryName=code=>countryContinents.has(code)?countryName(code):code;
function catalogCountries() {
 const codes=[...new Set(data.airports.map(catalogCountry).filter(Boolean))];
 return codes.sort((a,b)=>a==='RU'?-1:b==='RU'?1:catalogCountryName(a).localeCompare(catalogCountryName(b),appLanguage()));
}
function filteredAirports() {
 const needle = query.trim().toLowerCase().replaceAll('ё','е');
 return data.airports.filter(a=>{
  const info=airportInfo(a.icao);
  return (!airportCountryFilter||catalogCountry(a)===airportCountryFilter) && [a.icao,a.iata,a.name,a.country,info?.cityRu,info?.cityEn,info?.nameRu,info?.nameEn]
   .join(' ').toLowerCase().replaceAll('ё','е').includes(needle) &&
   (airportFilter==='all'||airportFilter==='scenery'&&a.scenery||airportFilter==='missing'&&a.scenery&&!a.gsx) &&
   (regionFilter==='all'||(regionFilter==='domestic')===isDomestic(a));
 });
}
function airportRows() {
 const matches=filteredAirports();
 if(!matches.length) return `<p class="muted">${tr("Аэропорты не найдены.")}</p>`;

function validBackup(value) {
 return value && Array.isArray(value.airports) && Array.isArray(value.flights) &&
 value.airports.every(a=>a && /^[A-Z]{4}$/.test(a.icao) && typeof a.name==='string') &&
 value.flights.every(f=>f && typeof f.id==='string' && fleet.some(a=>a.tail===f.tail) &&
 /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(f.date) && /^[0-9]{2}:[0-9]{2}$/.test(f.std) &&
 Number.isFinite(clockOn(f.date,f.std)) && typeof f.sta==='string');
}

  const f=flight(), status=t.value;
  t.value=f.status;
  if(status==='Уход на запасной'||isDiversion(f)) editFlight(f,status==='Уход на запасной');
  else {f.status=status;save();render();}
 }
 if(t.id==='flightPicker'){selected=t.value;render();}
 if(t.id==='airportFilter'){airportFilter=t.value;refreshAirports();}
 if(t.id==='regionFilter'){regionFilter=t.value;refreshAirports();}
 if(t.id==='airportCountry'){
  airportCountryFilter=t.value;airportListPage=0;query='';regionFilter='all';
  render();byId('airportCountry')?.focus();
 }
 if(t.id==='journalDate'){journalDate=t.value;render();byId('journalDate')?.focus();}
 if(t.id==='typeFilter'){typeFilter=t.value;render();}
 if(t.id==='statusFilter'){statusFilter=t.value;render();}
 if(t.id==='journalFilter'){journalFilter=t.value;render();}
 if(d.stand){
  const f=flight();
  if(t.value==='__manual'){t.value=f[d.stand]||'';manualStand(f,d.stand);}
  else {f[d.stand]=t.value;save();}
 }
 if(d.flag){
  airport(airportCode)[d.flag]=t.checked;
  save();
  document.querySelector('[data-flag-label="'+d.flag+'"]').textContent=t.checked?tr("Установлен"):tr("Не установлен");
  byId('airportRows').innerHTML=airportRows();
 }
 if(d.parking){const a=airport(airportCode);a.stands??={};a.stands[d.parking]=t.value;save();}
 if(d.airportScenery){airport(airportCode)[d.airportScenery]=t.value.trim();save();}
 if(t.id==='airportIata'){const value=t.value.trim().toUpperCase();if(value&&!/^[A-Z]{3}$/.test(value)){notice(tr("Код IATA должен состоять из трех латинских букв."));t.value=airport(airportCode).iata;return;}airport(airportCode).iata=value;save();render();}
});
if(pages.some(([key])=>key===preferences().startPage)) page=preferences().startPage;
if(!flight()) pickTail(tail);
render();
resumeGoogleSignIn();
const splash = byId('splash');
const shell = document.querySelector('.shell');
shell.inert = true;
splash.classList.add('loading');
setTimeout(() => {
 splash.classList.add('ready');
 splash.setAttribute('aria-hidden','true');
 shell.inert = false;
 if(!tourCompleted()&&!byId('dialog').open)startTour();
}, 2000);
if(!storageAvailable) notice(tr("Хранилище недоступно. Выгрузи резервную копию после работы."));
setInterval(()=>queueCloudSync(0),45000);
window.addEventListener('online',()=>queueCloudSync(0));
window.addEventListener('offline',updateCloudIndicator);
setInterval(()=>{
 const clock=byId('utcClock');
 if(clock) clock.textContent=utcLabel();
 const track=byId('flightTrack');
 if(track&&flight()){
  const progress=routeProgress(flight());
  track.style.setProperty('--progress',progress+'%');
  byId('flightProgressLabel').textContent=tr(routeProgressLabel(flight(),progress));
 }
},1000);
</script></body></html>
