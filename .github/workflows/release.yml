name: Release FlightDeck
on:
  push:
    branches: ['release/v*', 'release/patch/v*', 'release/windows/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Public release tag matching the app version, for example v0.1.0'
        required: true
      publish_patch:
        description: 'Allow an explicitly requested public patch release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: flightdeck-release
  cancel-in-progress: false
env:
  RELEASE_REF: ${{ inputs.tag || github.ref_name }}
  ALLOW_PATCH: ${{ inputs.publish_patch || startsWith(github.ref, 'refs/heads/release/patch/') }}
jobs:
  mac:
    if: ${{ !startsWith(github.ref, 'refs/heads/release/windows/') }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        run: |
          RELEASE_TAG="${RELEASE_REF#release/}"
          export RELEASE_TAG="${RELEASE_TAG#patch/}"
          python3 - <<'PY'
          import os, plistlib, json, re
          with open('FlightDesk/Info.plist','rb') as f: version=plistlib.load(f)['CFBundleShortVersionString']
          assert re.fullmatch(r'(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}', version), 'Invalid version'
          assert version.endswith('.0') or os.environ['ALLOW_PATCH'] == 'true', 'Publishing a patch requires explicit opt-in'
          assert os.environ['RELEASE_TAG'] == 'v'+version, 'Tag must match Info.plist'
          assert json.load(open('FlightDeck-Windows/package.json'))['version'] == version
          PY
      - name: Build universal macOS app and installer
        env:
          UNIVERSAL_BUILD: '1'
          FLIGHTDECK_YANDEX_MAPS_KEY: ${{ secrets.FLIGHTDECK_YANDEX_MAPS_KEY }}
          FLIGHTDECK_YANDEX_TILES_KEY: ${{ secrets.FLIGHTDECK_YANDEX_TILES_KEY }}
        run: |
          python3 FlightDesk/build-web.py
          bash FlightDesk/build-mac.sh
          bash FlightDesk/build-installer.sh
      - name: Verify macOS installation over the legacy version
        run: |
          plist=FlightDesk/Info.plist
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          package="releases/FlightDeck-macOS-$version.pkg"
          app=/Applications/FlightDeck.app
          sudo ditto FlightDesk/FlightDeck.app "$app"
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.24.0' "$app/Contents/Info.plist"
          sudo /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $((build + 1))" "$app/Contents/Info.plist"
          if sudo /usr/sbin/installer -pkg "$package" -target /; then
            echo "Installer unexpectedly allowed a build downgrade"
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$((build + 1))"
          sudo /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 29' "$app/Contents/Info.plist"
          sudo /usr/sbin/installer -pkg "$package" -target /
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$build"
          codesign --verify --deep --strict "$app"
      - name: Sign update manifest
        env:
          FLIGHTDECK_UPDATE_PRIVATE_KEY: ${{ secrets.FLIGHTDECK_UPDATE_PRIVATE_KEY }}
        run: |
          RELEASE_TAG="${RELEASE_REF#release/}"
          RELEASE_TAG="${RELEASE_TAG#patch/}"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' FlightDesk/Info.plist)
          swift tools/sign-update.swift sign "releases/FlightDeck-macOS-$version.pkg" "$RELEASE_TAG" releases/macos-update.json
      - name: Verify macOS manifest and package checksum
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' FlightDesk/Info.plist)
          swift tools/sign-update.swift verify "releases/FlightDeck-macOS-$version.pkg" releases/macos-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            releases/*.pkg
            releases/macos-update.json
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Windows release version
        working-directory: FlightDeck-Windows
        run: |
          $tag = $env:RELEASE_REF -replace '^release/(patch/|windows/)?',''
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -cne "v$version") { throw "Tag must match the Windows app version" }
      - name: Build Windows installers and update metadata
        working-directory: FlightDeck-Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          FLIGHTDECK_YANDEX_MAPS_KEY: ${{ secrets.FLIGHTDECK_YANDEX_MAPS_KEY }}
          FLIGHTDECK_YANDEX_TILES_KEY: ${{ secrets.FLIGHTDECK_YANDEX_TILES_KEY }}
        run: |
          npm install --no-audit --no-fund
          npm run build -- --publish never
      - name: Verify the Windows installer
        working-directory: FlightDeck-Windows
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Resolve-Path "dist/FlightDeck-$version-Windows-Setup.exe"
          $manifest = Get-Content dist/latest.yml -Raw
          $checksum = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $setup -Algorithm SHA512).Hash))
          if ($manifest -notmatch "(?m)^sha512: $([regex]::Escape($checksum))\r?$") { throw "Installer checksum does not match latest.yml" }
          $install = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\FlightDeck\FlightDeck.exe'
          $installed = (Get-Item $exe).VersionInfo
          $installedVersion = "$($installed.ProductMajorPart).$($installed.ProductMinorPart).$($installed.ProductBuildPart)"
          if ($installedVersion -ne $version) { throw "Expected FlightDeck $version, found $installedVersion" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            FlightDeck-Windows/dist/*.exe
            FlightDeck-Windows/dist/*.blockmap
            FlightDeck-Windows/dist/latest*.yml
  publish:
    needs: [mac, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && (needs.mac.result == 'success' || (startsWith(github.ref, 'refs/heads/release/windows/') && needs.mac.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Carry forward the signed macOS update
        if: ${{ startsWith(github.ref, 'refs/heads/release/windows/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release view --json tagName --jq .tagName)"
          gh release download "$previous" --dir release-assets --pattern macos-update.json --pattern 'FlightDeck-macOS-*.pkg'
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          assets = Path('release-assets')
          manifest = json.loads((assets / 'macos-update.json').read_bytes())
          payload = json.loads(base64.b64decode(manifest['payload']))
          package = assets / f'FlightDeck-macOS-{payload["version"]}.pkg'
          with package.open('rb') as file:
              assert hashlib.file_digest(file, 'sha256').hexdigest() == payload['sha256'], 'macOS package checksum mismatch'
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="${RELEASE_REF#release/}"
          RELEASE_TAG="${RELEASE_TAG#patch/}"
          RELEASE_TAG="${RELEASE_TAG#windows/}"
          notes="$RUNNER_TEMP/flightdeck-release-notes.md"
          awk -v heading="## $RELEASE_TAG" '$0 == heading { found=1; next } found && /^## / { exit } found' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "Add release notes to CHANGELOG.md for $RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "FlightDeck $RELEASE_TAG" --notes-file "$notes" --latest
