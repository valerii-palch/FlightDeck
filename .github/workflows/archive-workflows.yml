name: Archive retired desktop workflows
on:
  push:
    branches: ['maintenance/archive-workflows']
permissions:
  contents: write
  actions: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only current desktop workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, method=None):
              command = ['gh', 'api', 'repos/'+repo+'/'+path]
              if method: command += ['--method', method]
              output = subprocess.check_output(command, text=True)
              return json.loads(output) if output.strip() else None
          allowed = {'.github/workflows/desktop-tests.yml', '.github/workflows/release.yml'}
          for workflow in api('actions/workflows?per_page=100')['workflows']:
              if workflow['path'] not in allowed and workflow['state'] == 'active':
                  api('actions/workflows/'+str(workflow['id'])+'/disable', 'PUT')
          active = [w['path'] for w in api('actions/workflows?per_page=100')['workflows'] if w['state'] == 'active']
          assert set(active) == allowed, active
          print('Verified only desktop tests and desktop release remain enabled')
          ref = os.environ['GITHUB_REF']
          sha = os.environ['GITHUB_SHA']
          subprocess.run(['git', 'push', '--force-with-lease='+ref+':'+sha, 'origin', ':'+ref], check=True)
          PY
