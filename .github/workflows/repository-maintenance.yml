          ])
          kept = {'refs/heads/main', 'refs/tags/v0.4.0', 'refs/tags/v0.5.0'}
          raw = subprocess.check_output(['git', 'ls-remote', '--refs', 'origin', 'refs/heads/*', 'refs/tags/*'], text=True)
