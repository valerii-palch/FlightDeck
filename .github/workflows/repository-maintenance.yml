              assert item['ref'] not in kept
              assert current[item['ref']] == item['sha'], 'A ref changed during verification'
          leases = ['--force-with-lease='+item['ref']+':'+item['sha'] for item in plan]
          deletes = [':'+item['ref'] for item in plan]
